<div class="container">
  <div class="image-section">
    <img src="https://energika.com.tn/wp-content/uploads/2022/02/bann-1-scaled.jpg" alt="Login image">
  </div>

  <div class="login-section">
    <div class="login-header">
      <h1>LOG IN</h1>
    </div>

    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" novalidate>

      <div class="form-group">
        <label for="username">User name</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          #username="ngModel"
          required
          placeholder="@username"
          pattern="^@[a-zA-Z0-9_]+$"> <div class="invalid-feedback" *ngIf="username.invalid && (username.dirty || username.touched)">
          <small *ngIf="username.errors?.['required']">Le nom d'utilisateur est requis.</small>
          <small *ngIf="username.errors?.['pattern']">L'identifiant doit commencer par @ (ex: @hajerayed).</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          #password="ngModel"
          required
          minlength="8"
          placeholder="••••••••">

        <div class="invalid-feedback" *ngIf="password.invalid && (password.dirty || password.touched)">
          <small *ngIf="password.errors?.['required']">Le mot de passe est requis.</small>
          <small *ngIf="password.errors?.['minlength']">Minimum 8 caractères.</small>
        </div>
      </div>

      <div class="forget-password">
        <a routerLink="/forget-password">Mot de passe oublié ?</a>
      </div>

      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid || isLoading" 
        class="submit-btn">
        <span *ngIf="!isLoading">SUBMIT</span>
        <span *ngIf="isLoading" class="spinner">Chargement...</span>
      </button>

    </form>

    <div class="alternative-login">
      <p>Social media</p>
      <div class="social-login">
        <div class="social-btn" (click)="onGoogleLogin()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        </div>
        <div class="social-btn" (click)="onFacebookLogin()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/facebook.svg" alt="Facebook">
        </div>
      </div>
    </div>
  </div>
</div>
