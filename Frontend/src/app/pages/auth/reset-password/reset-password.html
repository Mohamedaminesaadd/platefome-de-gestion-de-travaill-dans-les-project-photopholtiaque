<div class="container">
  <div class="forgot-section">
    <div class="forgot-header">
      <h1>RESET PASSWORD</h1>
      <p>Entrez votre nouveau mot de passe.</p>
    </div>

    <form (ngSubmit)="onSubmit(resetForm)" #resetForm="ngForm">

      <!-- Nouveau mot de passe -->
      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          #passwordRef="ngModel"
          required
          minlength="6"
          placeholder="********">

        <div class="invalid" *ngIf="passwordRef.errors?.['required'] && passwordRef.touched">
          Le mot de passe est requis.
        </div>
        <div class="invalid" *ngIf="passwordRef.errors?.['minlength'] && passwordRef.touched">
          Minimum 6 caractères.
        </div>
      </div>

      <!-- Confirmation -->
      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          #confirmRef="ngModel"
          required
          placeholder="********">

        <div class="invalid" *ngIf="confirmRef.touched && password !== confirmPassword">
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <!-- ✅ Message erreur backend -->
      <div class="invalid" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="resetForm.invalid || password !== confirmPassword || loading"
        class="submit-btn">
        {{ loading ? 'Chargement...' : 'Réinitialiser' }}
      </button>

    </form>

    <!-- ✅ Message succès -->
    <div class="success" *ngIf="resetSuccess">
      ✅ Mot de passe réinitialisé avec succès. Redirection...
    </div>

    <div class="back-login">
      <a routerLink="/login">Retour au login</a>
    </div>

  </div>
</div>
