<section>

  <!-- Header -->
  <div class="section-header">
    <h2 class="section-title">My Projects</h2>
    <button class="btn-primary" matRipple (click)="onNewProject()">
      <mat-icon>add</mat-icon>
      New Project
    </button>
  </div>

  <!-- Recherche -->
  <div class="search-bar">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      class="search-input"
      placeholder="Rechercher un projet..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
    />
  </div>

  <!-- Grid -->
  <div class="projects-grid" *ngIf="filteredProjects.length > 0; else noData">
    <div
      class="proj-card"
      matRipple
      *ngFor="let p of filteredProjects; trackBy: trackById"
    >
      <!-- Card Header -->
      <div class="proj-card-header">
        <div>
          <div class="proj-name">{{ p.name }}</div>
          <div class="proj-client">{{ p.client }}</div>
        </div>
        <span
          class="badge"
          [class.badge-inprogress]="p.status === 'IN_PROGRESS'"
          [class.badge-delayed]="p.status === 'DELAYED'"
          [class.badge-completed]="p.status === 'COMPLETED'"
        >
          {{ statusLabel(p.status) }}
        </span>
      </div>

      <!-- Progress -->
      <div class="progress-block">
        <div class="progress-meta">
          <span class="progress-label">Progress</span>
          <span class="progress-pct">{{ p.progress }}%</span>
        </div>
        <div class="progress-track">
          <div
            class="progress-fill"
            [class.fill-blue]="p.status === 'IN_PROGRESS' && p.progress > 50"
            [class.fill-sky]="p.status === 'IN_PROGRESS' && p.progress <= 50"
            [class.fill-orange]="p.status === 'DELAYED'"
            [class.fill-green]="p.status === 'COMPLETED'"
            [style.width.%]="p.progress"
          ></div>
        </div>
      </div>

      <!-- Footer -->
      <div class="proj-footer">
        <div class="proj-time" [class.overdue]="p.daysOverdue">
          <mat-icon>{{ p.daysOverdue ? 'error_outline' : 'schedule' }}</mat-icon>
          <span *ngIf="p.daysRemaining">{{ p.daysRemaining }} days remaining</span>
          <span *ngIf="p.daysOverdue">{{ p.daysOverdue }} days overdue</span>
          <span *ngIf="p.dueToday">Due Today</span>
        </div>

        <!-- Actions -->
        <div class="proj-actions">
          <button
            class="action-btn view-btn"
            matRipple
            matTooltip="Voir détails"
            (click)="onOpenProject(p)"
          >
            <mat-icon>visibility</mat-icon>
          </button>
          <button
            class="action-btn edit-btn"
            matRipple
            matTooltip="Modifier"
            (click)="onEditProject(p); $event.stopPropagation()"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            class="action-btn delete-btn"
            matRipple
            matTooltip="Supprimer"
            (click)="onDeleteProject(p); $event.stopPropagation()"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Aucun résultat -->
  <ng-template #noData>
    <div class="no-data">
      <mat-icon>search_off</mat-icon>
      <span>Aucun projet trouvé</span>
    </div>
  </ng-template>

</section>
