<!-- ── STATS ROW ─────────────────────────────────────────── -->
      <div class="stats-row">

        <div class="stat-card" matRipple>
          <div class="stat-icon" style="background:#EFF6FF">
            <mat-icon style="color:#2563EB">folder_open</mat-icon>
          </div>
          <div>

            <div class="stat-label">Active Projects</div>
            <div class="stat-value">4</div>
            <div class="stat-sub"><span class="up">↑ 2</span> this month</div>
          </div>
        </div>

        <div class="stat-card" matRipple>
          <div class="stat-icon" style="background:#ECFDF5">
            <mat-icon style="color:#10B981">task_alt</mat-icon>
          </div>

          <div>
            <div class="stat-label">Tasks Today</div>
            <div class="stat-value">{{ tasks.length }}</div>
            <div class="stat-sub">
              <span style="color:#EF4444;font-weight:700">2 HIGH</span> priority
            </div>
          </div>
        </div>

        <div class="stat-card" matRipple>
          <div class="stat-icon" style="background:#FEF2F2">
            <mat-icon style="color:#EF4444">schedule</mat-icon>
          </div>

          <div>
            <div class="stat-label">Overdue</div>
            <div class="stat-value">1</div>
            <div class="stat-sub"><span class="down">3 days</span> late</div>
          </div>
        </div>

        <div class="stat-card" matRipple>
          <div class="stat-icon" style="background:#F5F3FF">
            <mat-icon style="color:#7C3AED">bolt</mat-icon>
          </div>

          <div>
            <div class="stat-label">Completion Rate</div>
            <div class="stat-value">58%</div>
            <div class="stat-sub"><span class="up">↑ 12%</span> vs last week</div>
          </div>
        </div>

      </div>
