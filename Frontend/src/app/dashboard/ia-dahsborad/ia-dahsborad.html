<div class="dashboard-wrapper">

  <!-- Stats row -->
  <div class="stats-row" *ngIf="!isLoading && !hasError">
    <div class="stat-card">
      <span class="stat-label">Tâches analysées</span>
      <span class="stat-value">{{ totalTasks }}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Erreur moyenne</span>
      <span class="stat-value">{{ avgError }}h</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Précision (±1h)</span>
      <span class="stat-value accent">{{ accuracy }}%</span>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Prédit vs Réel — Durée des tâches</span>
      <div class="legend">
        <span class="legend-dot" style="background:#7C3AED"></span> Prédit
        <span class="legend-dot" style="background:#F59E0B; margin-left:12px"></span> Réel
      </div>
    </div>

    <div class="chart-body">
      <div *ngIf="isLoading" class="state-overlay">
        <span class="spinner"></span> Chargement des prédictions…
      </div>
      <div *ngIf="hasError" class="state-overlay error">
        ⚠️ Impossible de contacter l'API ML
      </div>
      <canvas #durationChart *ngIf="!isLoading && !hasError"></canvas>
    </div>
  </div>

</div>
