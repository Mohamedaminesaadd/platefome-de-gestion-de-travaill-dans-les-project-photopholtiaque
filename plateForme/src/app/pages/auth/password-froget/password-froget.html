<div class="container">
  <div class="forgot-section">
    <div class="forgot-header">
      <h1>RESET PASSWORD</h1>
      <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
    </div>

    <form (ngSubmit)="onSubmit(forgotForm)" #forgotForm="ngForm">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailRef="ngModel"
          required
          email
          placeholder="exemple@mail.com">

        <!-- Erreurs -->
        <div class="invalid" *ngIf="emailRef.errors?.['required'] && emailRef.touched">
          L'email est requis.
        </div>

        <div class="invalid" *ngIf="emailRef.errors?.['email'] && emailRef.touched">
          Format d'email invalide.
        </div>
      </div>

      <!-- Bouton -->
      <button [disabled]="forgotForm.invalid" class="submit-btn">
        Envoyer le lien
      </button>

    </form>

    <!-- Message succès -->
    <div class="success" *ngIf="emailSent">
      Un email de réinitialisation a été envoyé.
    </div>

    <!-- Retour login -->
    <div class="back-login">
      <a routerLink="/login">Retour au login</a>
    </div>

  </div>
</div>
